<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Door County Creamery</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Door C<span>oun</span>ty Creamery</h1>
        </header>
        <br>
        <main>
            <content>
                <h3>Rhubarb Preserves</h3>
                <!-- Image from https://unsplash.com/photos/a-shelf-filled-with-lots-of-jars-of-jam-EAupCbU8JiA -->
                <img src="rhubarbjam.jpg" alt="shelf with jars of rhubarb preserves">
                <p><span>$7.99</span> per jar</p>
                <button>add to cart</button>
            </content>
            <content>
                <h3>Aged Cheddar Wheels</h3>
                <!-- Image from https://unsplash.com/photos/wheeled-farmers-cheese-stacked-on-shelves-1RWbrSqohzk -->
                <img src="cheddarwheel.jpg" alt="plentiful stacks of cheddar wheels piled up">
                <p><span>$19.99</span> per wheel</p>
                <button>add to cart</button>
            </content>
            <content>
                <h3>In-House Cherry Wine</h3>
                <!-- Image from https://unsplash.com/photos/clear-wine-glass-with-red-wine-Y4PJ5F_Oskw -->
                <img src="cherrywine.jpg" alt="aesthetic top-down image of red wine in glass on white tablecloth">
                <p><span>$22.99</span> per bottle</p>
                <button>add to cart</button>
            </content>
            <br>
        </main>
        
    </body>
</html>
